[project]
name = "opera-backend"
version = "0.1.0"
description = "OPERA V1 backend: privacy-preserving photo geolocation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "imagehash>=4.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
postgres = ["psycopg[binary]>=3.2"]
eval = ["reverse_geocoder>=1.5"]  # offline country lookup for evaluation metrics
geoclip = ["torch", "torchvision", "transformers", "geoclip==1.2.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-model tests; skipped when weights are unavailable"]
addopts = "-q"
